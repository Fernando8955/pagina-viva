<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Entenda Hemorroidas 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: cena 3D em tela cheia (canal anal em corte) sobre fundo escuro de consultório;
   abas no topo e um cartão-folha embaixo com o texto e os controles. Visual único, igual nos dois temas. */
:root{
  --stage:#17232c;
  --paper:#f7f6f2;
  --soft:#ecebe5;
  --ink:#1b2a33;
  --ink-2:#56656d;
  --rule:#d8d7cf;
  --brand:#0f6b5c;
  --amber:#b8620f;
  --amber-bg:#fbefdf;
  --f-display:"Literata",Georgia,serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:15.5px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:10px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud .grow{flex:1}
.live{pointer-events:auto}
.top{display:flex;flex-direction:column;gap:8px;align-items:center}
.title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;color:var(--paper)}
.title b{font:700 17px var(--f-display)}
.tag{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#f0b46a;border:1px solid #7a5a32;border-radius:999px;padding:4px 9px}
.tabs{display:flex;gap:4px;background:rgba(247,246,242,.12);border-radius:999px;padding:4px}
.tab{appearance:none;border:0;background:transparent;color:var(--paper);font:700 14px var(--f-body);padding:10px 16px;border-radius:999px;cursor:pointer;min-height:42px}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
button:focus-visible{outline:3px solid #6fd3bd;outline-offset:2px}
.sheet{align-self:center;width:min(600px,100%);background:var(--paper);border-radius:14px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 34px rgba(0,0,0,.4);position:relative}
.sheet.min{max-height:none}
.sheet.min > *:not(.eyebrow):not(.stog){display:none!important}
.stog{position:absolute;top:8px;right:8px;appearance:none;border:1px solid var(--rule);background:var(--soft);color:var(--ink);font:700 13px var(--f-body);padding:10px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.eyebrow{font:600 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding-right:120px;min-height:24px;display:flex;align-items:center}
h1{font:700 23px/1.15 var(--f-display);margin:0;text-wrap:balance}
p{margin:0;line-height:1.5}
.muted{color:var(--ink-2);font-size:14.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:grid;gap:6px}
.seg.g4{grid-template-columns:repeat(4,1fr)}
.seg.g3{grid-template-columns:repeat(3,1fr)}
.sb{appearance:none;border:1px solid var(--rule);background:var(--soft);color:var(--ink);border-radius:10px;padding:10px 6px;font:700 15px var(--f-body);cursor:pointer;min-height:48px;line-height:1.15}
.sb small{display:block;font:500 11px var(--f-body);color:var(--ink-2)}
.sb[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sb[aria-pressed="true"] small{color:var(--paper);opacity:.8}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 14px;font:700 14.5px var(--f-body);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--soft);color:var(--ink);border-radius:999px;padding:8px 12px 8px 9px;font:700 13.5px var(--f-body);cursor:pointer;min-height:40px}
.chip .d{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.chip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--brand);background:var(--paper)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;line-height:1.45}
.steps li.on{font-weight:700}
.info{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.info b{font:700 17px var(--f-display)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
td:first-child{font-weight:700}
.cmp summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.note{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.4}
.pin{position:fixed;left:0;top:0;pointer-events:none;background:var(--paper);color:var(--ink);font:700 13px/1 var(--f-body);padding:7px 10px;border-radius:7px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.side{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(120px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.ib{appearance:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(247,246,242,.3);background:rgba(23,35,44,.7);color:var(--paper);font:700 18px var(--f-body);cursor:pointer;display:grid;place-items:center}
.hint{color:rgba(247,246,242,.75);font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--paper)}
@media (max-width:640px){
  .sheet{padding:12px 14px 14px;gap:8px}
  .chip{padding:7px 10px 7px 8px;font-size:13px;min-height:38px}
  .sb{min-height:44px;padding:8px 4px}
  h1{font-size:21px}
  .title b{font-size:15.5px}
  .tab{padding:10px 12px;font-size:13.5px}
  .side{top:calc(132px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="scene" aria-label="Modelo 3D do canal anal em corte, com hemorroidas"></canvas>
<div class="hud">
  <div class="top live">
    <div class="title"><a href="../saude/" style="color:var(--paper);text-decoration:none;font-weight:700;border:1px solid rgba(247,246,242,.35);border-radius:999px;padding:6px 10px;font-size:13px">← Voltar</a><b>Entenda seu tratamento · Hemorroidas</b><span class="tag">Demonstração</span></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="ana" aria-selected="true">Anatomia</button>
      <button class="tab" role="tab" data-t="grau" aria-selected="false">Graus</button>
      <button class="tab" role="tab" data-t="trat" aria-selected="false">Tratamentos</button>
    </div>
    <span class="hint">Gire com um dedo · aproxime com dois</span>
  </div>
  <div class="grow"></div>
  <section class="sheet live" id="sheet" aria-live="polite"></section>
</div>
<div class="side"><button class="ib" id="resetView" aria-label="Voltar à vista inicial" title="Voltar à vista inicial">⟲</button></div>
<div class="pin" id="pin" hidden></div>
<div class="nogl" id="nogl" hidden>Este aparelho não conseguiu abrir a cena 3D. Tente em outro navegador.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!window.THREE){$('#nogl').hidden=false;return;}
const V3=THREE.Vector3,V2=THREE.Vector2,INK=0x1b2a33;

/* ---------- conteúdo ---------- */
const PARTS={
  reto:{n:'Reto',c:0xe58a8c,css:'#e58a8c',t:'Parte final do intestino grosso. Guarda as fezes até a hora de evacuar.'},
  canal:{n:'Canal anal',c:0xe9b7a8,css:'#e9b7a8',t:'Tem cerca de 3 a 4 cm. Abaixo da linha pectínea a pele é sensível à dor.'},
  linha:{n:'Linha pectínea',c:0xf2e2a8,css:'#f2e2a8',t:'Divide o canal em duas partes. Acima dela quase não há sensação de dor; abaixo, há muita.'},
  hemInt:{n:'Hemorroidas internas',c:0xb8456b,css:'#b8456b',t:'Almofadas de vasos que todos temos e que ajudam a fechar o ânus. Viram doença quando incham, sangram ou saem para fora.'},
  arteria:{n:'Artérias hemorroidárias',c:0xc62f3b,css:'#c62f3b',t:'Levam sangue às hemorroidas. É nelas que a técnica THD atua.'},
  esfInt:{n:'Esfíncter interno',c:0xdfa27c,css:'#dfa27c',t:'Músculo involuntário que mantém o ânus fechado em repouso.'},
  esfExt:{n:'Esfíncter externo',c:0xb5473e,css:'#b5473e',t:'Músculo que você controla para segurar as fezes. Preservá-lo é essencial em qualquer cirurgia.'},
  hemExt:{n:'Hemorroidas externas',c:0x7d5ba6,css:'#7d5ba6',t:'Ficam abaixo da linha pectínea, sob a pele. Podem formar coágulo (trombose) e doer bastante.'}
};
const ORDER=['reto','canal','linha','hemInt','arteria','esfInt','esfExt','hemExt'];
const GRAUS=[
  {g:'I',t:'Grau I',d:'As hemorroidas incham por dentro e podem sangrar, mas não saem do ânus.',p:0},
  {g:'II',t:'Grau II',d:'Saem ao fazer força para evacuar e voltam sozinhas logo depois.',p:'loop'},
  {g:'III',t:'Grau III',d:'Saem ao fazer força e só voltam empurrando com o dedo.',p:0.85},
  {g:'IV',t:'Grau IV',d:'Ficam para fora o tempo todo e não voltam para dentro, mesmo empurrando.',p:1}
];
const TRATS=[
  {k:'conv',n:'Convencional',s:'hemorroidectomia',d:'O cirurgião retira os mamilos hemorroidários doentes. É a técnica mais antiga e duradoura.',
   steps:['Identifica o mamilo doente','Corta e retira o tecido','A ferida cicatriza em algumas semanas']},
  {k:'thd',n:'THD',s:'desarterialização',d:'Um aparelho com Doppler localiza as artérias que alimentam a hemorroida. O médico dá pontos que reduzem o sangue que chega e, se preciso, puxa o tecido de volta para o lugar.',
   steps:['O Doppler encontra a artéria pelo som','Um ponto fecha a artéria','A hemorroida murcha e é reposicionada (mucopexia)']},
  {k:'laser',n:'Laser',s:'hemorroidoplastia',d:'Uma fibra fina de laser é colocada dentro do mamilo hemorroidário. A energia faz o tecido encolher por dentro.',
   steps:['A fibra entra no mamilo','O laser aquece por dentro','O tecido encolhe nas semanas seguintes']}
];

/* ---------- cena ---------- */
const canvas=$('#scene');let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){$('#nogl').hidden=false;return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x17232c);
const camera=new THREE.PerspectiveCamera(36,1,0.1,100);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.08;controls.screenSpacePanning=true;controls.minDistance=2.5;controls.maxDistance=22;
scene.add(new THREE.HemisphereLight(0xffffff,0x31424c,.85));
const key=new THREE.DirectionalLight(0xfff3e6,.6);key.position.set(3,6,8);scene.add(key);
const fill=new THREE.DirectionalLight(0xcfe6ff,.25);fill.position.set(-6,2,3);scene.add(fill);

const gm=new THREE.DataTexture(new Uint8Array([110,185,255]),3,1,THREE.LuminanceFormat);
gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.generateMipmaps=false;gm.needsUpdate=true;
const mats={};
ORDER.forEach(k=>{mats[k]=new THREE.MeshToonMaterial({color:PARTS[k].c,gradientMap:gm,transparent:true,side:THREE.DoubleSide});});
const olMat=new THREE.MeshBasicMaterial({color:INK,side:THREE.BackSide,transparent:true});
const pick=[];const anchors={};
const model=new THREE.Group();scene.add(model);
function tag(m,k){m.userData.part=k;pick.push(m);return m;}

/* parede (corte: mostra a metade de trás) */
const HALF=[Math.PI/2,Math.PI];
function shellFrom(inner,th){const pts=inner.map(p=>new V2(p[0],p[1]));const outer=inner.slice().reverse().map(p=>new V2(p[0]+th,p[1]));return new THREE.LatheGeometry(pts.concat(outer),72,HALF[0],HALF[1]);}
const upper=[[1.5,5.6],[1.5,4.2],[1.36,3.0],[0.98,2.0],[0.58,1.4],[0.53,0.6],[0.52,0.2]];
const lower=[[0.52,0.2],[0.5,-0.4],[0.52,-0.85],[0.62,-1.12],[0.95,-1.33],[1.7,-1.45]];
model.add(tag(new THREE.Mesh(shellFrom(upper,0.13),mats.reto),'reto'));
model.add(tag(new THREE.Mesh(shellFrom(lower,0.13),mats.canal),'canal'));
/* esfíncter interno */
model.add(tag(new THREE.Mesh(new THREE.LatheGeometry([[0.66,1.3],[0.66,-0.7],[0.84,-0.7],[0.84,1.3]].map(p=>new V2(p[0],p[1])),64,HALF[0],HALF[1]),mats.esfInt),'esfInt'));
/* esfíncter externo: anéis de músculo */
const extG=new THREE.Group();model.add(extG);
for(let y=1.0;y>=-1.16;y-=0.18){
  const R=y<-0.7?0.98:1.03,t=new THREE.TorusGeometry(R,0.12,10,48,Math.PI);t.rotateX(-Math.PI/2);
  const m=tag(new THREE.Mesh(t,mats.esfExt),'esfExt');m.position.y=y;extG.add(m);
}
/* linha pectínea */
const lineG=new THREE.TorusGeometry(0.505,0.028,8,48,Math.PI);lineG.rotateX(-Math.PI/2);
const line=tag(new THREE.Mesh(lineG,mats.linha),'linha');line.position.y=0.2;model.add(line);
anchors.linha=line;
const ancReto=new THREE.Object3D();ancReto.position.set(0,3.4,-1.3);model.add(ancReto);anchors.reto=ancReto;
const ancCanal=new THREE.Object3D();ancCanal.position.set(0,-0.6,-0.52);model.add(ancCanal);anchors.canal=ancCanal;
const ancInt=new THREE.Object3D();ancInt.position.set(0.55,1.2,-0.55);model.add(ancInt);anchors.esfInt=ancInt;
const ancExt=new THREE.Object3D();ancExt.position.set(-0.9,0.4,-0.5);model.add(ancExt);anchors.esfExt=ancExt;

/* hemorroidas: 3 almofadas na parede de trás */
const ANG=[125,180,235].map(a=>a*Math.PI/180);
const wallR=y=>y>1.4?0.58+(y-1.4)*0.4:y>-0.85?0.52:0.52+(-0.85-y)*1.3;
const cushions=ANG.map((a,i)=>{
  const g=new THREE.Group();
  const m=tag(new THREE.Mesh(new THREE.SphereGeometry(0.27,24,18),mats.hemInt),'hemInt');m.scale.set(1,1.75,0.78);
  const o=new THREE.Mesh(m.geometry,olMat);o.scale.setScalar(1.07);o.raycast=()=>{};m.add(o);
  g.add(m);model.add(g);
  const c={g,m,a,p:0,s:1,lift:0,hidden:false};place(c);return c;
});
function place(c){
  const y=0.78+c.lift-(0.78+1.62)*c.p,r=Math.max(0.24,wallR(y)-0.16+c.p*0.15);
  c.g.position.set(r*Math.sin(c.a),y,r*Math.cos(c.a));
  c.g.rotation.set(0,c.a,0);
  c.g.scale.setScalar(c.s*(1+0.25*c.p));
}
anchors.hemInt=cushions[1].m;
/* artérias */
const arteries=ANG.map(a=>{
  const pts=[[1.38,5.2],[1.32,3.6],[1.05,2.4],[0.72,1.6],[0.6,1.22]].map(p=>new V3(p[0]*Math.sin(a),p[1],p[0]*Math.cos(a)));
  const mat=mats.arteria.clone();
  const m=tag(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,0.045,8,false),mat),'arteria');model.add(m);return m;
});
anchors.arteria=new THREE.Object3D();anchors.arteria.position.set(1.32*Math.sin(ANG[1]),3.2,1.32*Math.cos(ANG[1]));model.add(anchors.arteria);
/* plexo externo */
ANG.forEach((a,i)=>{const m=tag(new THREE.Mesh(new THREE.SphereGeometry(0.11,16,12),mats.hemExt),'hemExt');const r=0.66;m.position.set(r*Math.sin(a),-1.05,r*Math.cos(a));m.scale.set(1.3,0.8,0.8);model.add(m);if(i===1)anchors.hemExt=m;});

/* ferramentas das técnicas */
const tools=new THREE.Group();model.add(tools);
const glassM=new THREE.MeshPhongMaterial({color:0xbfe8ff,transparent:true,opacity:.28,depthWrite:false,shininess:90});
const anoscope=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,2.4,32,1,true),glassM);anoscope.visible=false;tools.add(anoscope);
const wave=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.02,8,32),new THREE.MeshBasicMaterial({color:0x6fd3bd,transparent:true}));wave.visible=false;tools.add(wave);
const knot=new THREE.Mesh(new THREE.TorusGeometry(0.07,0.025,8,20),new THREE.MeshBasicMaterial({color:0x2fb47c}));knot.visible=false;tools.add(knot);
const fiber=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,2.2,8),new THREE.MeshBasicMaterial({color:0xe9eef2}));fiber.visible=false;tools.add(fiber);
const glowC=document.createElement('canvas');glowC.width=glowC.height=64;{const x=glowC.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,120,40,1)');g.addColorStop(1,'rgba(255,80,20,0)');x.fillStyle=g;x.fillRect(0,0,64,64);}
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(glowC),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));glow.visible=false;glow.scale.setScalar(.6);tools.add(glow);
const blade=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.75,0.02),new THREE.MeshBasicMaterial({color:0xe9eef2}));blade.visible=false;tools.add(blade);
const scar=new THREE.Mesh(new THREE.CircleGeometry(0.2,24),new THREE.MeshBasicMaterial({color:0x9c2f3a,transparent:true,side:THREE.DoubleSide}));scar.visible=false;tools.add(scar);

/* sombra no chão */
const sc=document.createElement('canvas');sc.width=sc.height=128;{const x=sc.getContext('2d'),g=x.createRadialGradient(64,64,4,64,64,64);g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);}
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(5,5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=-2.4;scene.add(shadow);

/* ---------- animação ---------- */
const tasks=[];let clock=0;
function task(delay,dur,up,done){tasks.push({t0:clock+delay,dur:REDUCE?0.01:dur,up,done});}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let loopGrade=false,sel=null;

function resetModel(){
  tasks.length=0;loopGrade=false;
  cushions.forEach(c=>{c.p=0;c.s=1;c.lift=0;c.m.visible=true;place(c);});
  arteries.forEach(a=>a.material.color.setHex(PARTS.arteria.c));
  [anoscope,wave,knot,fiber,glow,blade,scar].forEach(o=>o.visible=false);
  mats.hemInt.emissive.setRGB(0,0,0);
}
function focus(keys){ORDER.forEach(k=>{const on=!keys||keys.includes(k);mats[k].opacity=on?1:0.25;});arteries.forEach(a=>a.material.opacity=(!keys||keys.includes('arteria'))?1:0.25);olMat.opacity=(!keys||keys.includes('hemInt'))?1:0.2;}

function showGrade(i){
  resetModel();focus(null);const G=GRAUS[i];
  cushions.forEach(c=>{c.s=1+i*0.12;});
  if(G.p==='loop'){loopGrade=true;}
  else{cushions.forEach(c=>{const from=c.p;task(0,1.2,t=>{c.p=from+(G.p-from)*ease(t);place(c);});});}
  cushions.forEach(place);
}
function pushBack(){cushions.forEach(c=>{const from=c.p;task(0,1.1,t=>{c.p=from*(1-ease(t));place(c);});});}

function playTrat(k){
  resetModel();const c=cushions[1],cp=c.g.position.clone();
  cushions.forEach(x=>{x.s=1.2;place(x);});
  if(k==='conv'){
    focus(['hemInt','canal','reto','linha','esfInt','esfExt','hemExt']);
    blade.position.set(cp.x,cp.y,cp.z+0.3);
    task(0.3,0.9,t=>{blade.visible=true;blade.position.y=cp.y+0.5-1.0*ease(t);},()=>{blade.visible=false;});
    task(1.3,1.0,t=>{c.s=1.2*(1-ease(t));place(c);},()=>{c.m.visible=false;scar.visible=true;scar.position.set(cp.x*0.98,cp.y,cp.z*0.98);scar.lookAt(0,cp.y,0);});
    task(2.5,2.0,t=>{scar.material.color.setRGB(0.61+0.29*t,0.18+0.36*t,0.23+0.31*t);});
  }else if(k==='thd'){
    focus(['hemInt','arteria','canal','reto','linha']);
    const art=arteries[1];
    task(0.2,1.2,t=>{anoscope.visible=true;anoscope.position.set(0,-2.6+3.1*ease(t),0);});
    task(1.5,1.6,t=>{wave.visible=true;const k=(t*3)%1;wave.position.set(0.62*Math.sin(c.a),1.55,0.62*Math.cos(c.a));wave.lookAt(0,1.55,0);wave.scale.setScalar(0.6+k*1.6);wave.material.opacity=1-k;},()=>{wave.visible=false;});
    task(3.2,0.5,t=>{knot.visible=true;knot.position.set(0.66*Math.sin(c.a),1.5,0.66*Math.cos(c.a));knot.lookAt(0,1.5,0);knot.scale.setScalar(ease(t));});
    task(3.8,1.4,t=>{art.material.color.setRGB(0.78-0.3*t,0.18+0.3*t,0.23+0.3*t);});
    task(4.6,1.6,t=>{c.s=1.2-0.4*ease(t);c.lift=0.35*ease(t);place(c);});
    task(6.4,0.8,t=>{anoscope.position.y=0.5-3.1*ease(t);},()=>{anoscope.visible=false;});
  }else{
    focus(['hemInt','canal','reto','linha']);
    task(0.3,1.4,t=>{fiber.visible=true;const y=-2.8+(cp.y+1.1+2.8)*ease(t);fiber.position.set(cp.x*0.95,y-1.1+0.0,cp.z*0.95);});
    task(1.8,2.2,t=>{glow.visible=true;glow.position.set(cp.x*0.92,cp.y,cp.z*0.92);glow.material.opacity=0.6+0.4*Math.sin(t*20);mats.hemInt.emissive.setRGB(0.5*Math.sin(t*Math.PI),0.15*Math.sin(t*Math.PI),0);},()=>{glow.visible=false;mats.hemInt.emissive.setRGB(0,0,0);});
    task(4.0,1.8,t=>{c.s=1.2-0.55*ease(t);place(c);});
    task(4.2,1.0,t=>{fiber.position.y-=0.03;},()=>{fiber.visible=false;});
  }
}

/* ---------- câmera ---------- */
function home(instant){
  const portrait=innerWidth<innerHeight,k=portrait?1.75:1.55;
  const tgt=new V3(0,portrait?-2.0:-0.7,0),pos=tgt.clone().add(new V3(0.6,1.4,7.4).multiplyScalar(k));
  if(instant||REDUCE){camera.position.copy(pos);controls.target.copy(tgt);controls.update();return;}
  camTw={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:clock};
}
let camTw=null;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',()=>{resize();home(true);});
resize();home(true);
$('#resetView').onclick=()=>home();

/* ---------- toque nas partes ---------- */
const ray=new THREE.Raycaster(),ptr=new V2();let down=null;
const shown=o=>{while(o){if(!o.visible)return false;o=o.parent;}return true;};
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{
  if(!down)return;const mv=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(mv>7)return;
  ptr.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(ptr,camera);
  const h=ray.intersectObjects(pick,false).filter(x=>shown(x.object)&&x.object.material.opacity>0.5);
  select(h.length?h[0].object.userData.part:null);
});
function select(k){
  sel=k;
  if(tab!=='ana'){setTab('ana');}
  else renderSheet();
}

/* ---------- abas e folha ---------- */
let tab='ana',grade=0,trat=null,sheetMin=false,cmpOpen=false;
function setTab(t){
  tab=t;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  if(t==='ana'){resetModel();focus(sel?[sel]:null);}
  if(t==='grau'){if(sel){sel=null;}showGrade(grade);}
  if(t==='trat'){sel=null;trat?playTrat(trat):(resetModel(),focus(null));}
  renderSheet();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.dataset.t==='ana')sel=null;setTab(b.dataset.t);});
const sheet=$('#sheet');
function renderSheet(){
  let h='';
  if(tab==='ana'){
    if(sel)focus([sel]);
    h='<span class="eyebrow">Anatomia · canal anal em corte</span><h1>Todos temos hemorroidas</h1>'+
      '<p>São almofadas de vasos que ajudam a fechar o ânus. O problema começa quando incham, sangram ou saem para fora.</p>'+
      '<div class="chips">'+ORDER.map(k=>'<button class="chip" data-p="'+k+'" aria-pressed="'+(sel===k)+'"><span class="d" style="background:'+PARTS[k].css+'"></span>'+PARTS[k].n+'</button>').join('')+'</div>'+
      (sel?'<div class="info"><b>'+PARTS[sel].n+'</b><p>'+PARTS[sel].t+'</p></div>':'<p class="muted">Toque numa parte do modelo ou nos nomes acima.</p>');
  }else if(tab==='grau'){
    const G=GRAUS[grade];
    h='<span class="eyebrow">Graus das hemorroidas internas</span><h1>'+G.t+'</h1>'+
      '<div class="seg g4">'+GRAUS.map((x,i)=>'<button class="sb" data-g="'+i+'" aria-pressed="'+(i===grade)+'">'+x.g+'</button>').join('')+'</div>'+
      '<p>'+G.d+'</p>'+
      (grade===2?'<div class="row"><button class="btn" id="push">Empurrar de volta</button><button class="btn ghost" id="again">Ver sair de novo</button></div>':'')+
      (grade===1?'<p class="muted">Animação: a hemorroida sai durante o esforço e volta sozinha.</p>':'')+
      (grade===3?'<p class="muted">No grau IV, a hemorroida não volta para dentro.</p>':'');
  }else{
    const T=TRATS.find(x=>x.k===trat);
    h='<span class="eyebrow">Técnicas de tratamento cirúrgico</span><h1>'+(T?T.n+' <span style="font-weight:500;color:var(--ink-2);font-size:.8em">· '+T.s+'</span>':'Escolha uma técnica')+'</h1>'+
      '<div class="seg g3">'+TRATS.map(x=>'<button class="sb" data-k="'+x.k+'" aria-pressed="'+(x.k===trat)+'">'+x.n+'<small>'+x.s+'</small></button>').join('')+'</div>'+
      (T?'<p>'+T.d+'</p><ol class="steps">'+T.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol><div class="row"><button class="btn" id="replay">Ver de novo</button></div>':'<p class="muted">Toque numa técnica para ver no modelo o que é feito.</p>')+
      '<details class="cmp"'+(cmpOpen?' open':'')+'><summary>Comparar as 3 técnicas</summary><table><thead><tr><th></th><th>Corte</th><th>Dor depois</th><th>Usada em geral</th></tr></thead><tbody>'+
      '<tr><td>Convencional</td><td>Sim</td><td>Maior</td><td>Graus mais avançados</td></tr>'+
      '<tr><td>THD</td><td>Sem corte na pele</td><td>Menor</td><td>Graus intermediários</td></tr>'+
      '<tr><td>Laser</td><td>Mínimo</td><td>Menor</td><td>Casos selecionados</td></tr></tbody></table></details>'+
      '<div class="note">Comparação geral, varia de caso a caso. A técnica é escolhida pelo coloproctologista após a avaliação.</div>';
  }
  h+='<button class="stog" id="stog" aria-expanded="'+(!sheetMin)+'">'+(sheetMin?'Mostrar ▴':'Ocultar ▾')+'</button>';
  sheet.classList.toggle('min',sheetMin);sheet.innerHTML=h;
  sheet.querySelector('#stog').onclick=()=>{sheetMin=!sheetMin;renderSheet();};
  sheet.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{sel=sel===b.dataset.p?null:b.dataset.p;focus(sel?[sel]:null);renderSheet();});
  sheet.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{grade=+b.dataset.g;showGrade(grade);renderSheet();});
  sheet.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{trat=b.dataset.k;playTrat(trat);renderSheet();});
  const q=id=>sheet.querySelector('#'+id);
  if(q('push'))q('push').onclick=pushBack;
  if(q('again'))q('again').onclick=()=>showGrade(2);
  if(q('replay'))q('replay').onclick=()=>playTrat(trat);
  const cd=sheet.querySelector('.cmp');if(cd)cd.ontoggle=()=>{cmpOpen=cd.open;};
}
if(innerWidth<=640&&innerHeight>innerWidth){/* no celular, começa com a folha aberta mas compacta */}
renderSheet();

/* ---------- loop ---------- */
const pin=$('#pin'),tmp=new V3();let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  for(let i=tasks.length-1;i>=0;i--){const k=tasks[i];if(clock<k.t0)continue;const t=Math.min(1,(clock-k.t0)/k.dur);k.up(t);if(t>=1){tasks.splice(i,1);if(k.done)k.done();}}
  if(loopGrade){const ph=(clock%4)/4,p=ph<.35?ease(ph/.35)*0.75:ph<.6?0.75:ph<.85?0.75*(1-ease((ph-.6)/.25)):0;cushions.forEach(c=>{c.p=p;place(c);});}
  if(tab==='grau'&&grade===0){const s=1+0.05*Math.sin(clock*3);cushions.forEach(c=>{c.s=s;place(c);});}
  if(camTw){const t=Math.min(1,(clock-camTw.s)/1.2),e=ease(t);camera.position.lerpVectors(camTw.p0,camTw.p1,e);controls.target.lerpVectors(camTw.t0,camTw.t1,e);if(t>=1)camTw=null;}
  if(sel&&tab==='ana'){mats[sel].emissive.setRGB(0.15+0.1*Math.sin(clock*4),0.06,0.06);}
  ORDER.forEach(k=>{if(k!==sel||tab!=='ana'){if(!(k==='hemInt'&&tab==='trat'))mats[k].emissive.setRGB(0,0,0);}});
  controls.update();renderer.render(scene,camera);
  if(sel&&tab==='ana'&&anchors[sel]){anchors[sel].getWorldPosition(tmp);tmp.project(camera);if(tmp.z<1){pin.hidden=false;pin.textContent=PARTS[sel].n;pin.style.left=((tmp.x+1)/2*innerWidth)+'px';pin.style.top=((1-tmp.y)/2*innerHeight)+'px';}else pin.hidden=true;}else pin.hidden=true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('keydown',e=>{if(e.key==='Escape'){sel=null;renderSheet();focus(null);}});
})();
</script>
